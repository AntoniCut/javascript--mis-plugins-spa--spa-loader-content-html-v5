# ==============================================================
#  nginx — javascript.antonydev.tech/api
#  Fragmento para el server {} del dominio
#  --------------------------------------------------------------
#  - Va DENTRO del server {} existente; no es un site file.
#  - proxy_pass termina en "/" para quitar el prefijo /api/:
#    /api/health -> http://127.0.0.1:3100/health
#  - Node escucha solo en loopback (API_HOST=127.0.0.1), así que
#    el API no queda publicado directo en el puerto 3100.
# ==============================================================

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
