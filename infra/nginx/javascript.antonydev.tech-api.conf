# ==============================================================
#  nginx — {SITE_BASE}/api de javascript.antonydev.tech
#  Fragmento para el server {} del dominio
#  --------------------------------------------------------------
#  - Va DENTRO del server {} existente; no es un site file.
#  - SITE_BASE es /mis-plugins-spa/spa-loader-content-html-v5
#  - proxy_pass termina en "/" para quitar ese prefijo:
#    {SITE_BASE}/api/health       -> http://127.0.0.1:3100/health
#    {SITE_BASE}/api/tasks        -> http://127.0.0.1:3100/tasks
#    {SITE_BASE}/api/mysql/query  -> http://127.0.0.1:3100/mysql/query
#  - No uses location /api/: las páginas piden la ruta bajo el <base>.
#  - Node escucha solo en loopback (API_HOST=127.0.0.1).
#  - El 3200 está reservado para jquery-node en el mismo VPS.
# ==============================================================

location ^~ /mis-plugins-spa/spa-loader-content-html-v5/api/ {
    proxy_pass http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
