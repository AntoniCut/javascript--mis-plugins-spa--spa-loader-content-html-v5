# ==============================================================
#  nginx — javascript.antonydev.tech
#  Bloque del sitio: /mis-plugins-spa/spa-loader-content-html-v5
#  --------------------------------------------------------------
#  - Sirve los estáticos de dist/ y ejecuta los .php de
#    app/services/ con PHP-FPM.
#  - Usa `root` (no `alias`): con `alias`, $request_filename deja
#    de apuntar al PHP de app/services/.
#  - El `deny` de .env es obligatorio: sin él, el .env junto al
#    index.html se puede pedir por HTTP. PHP lo sigue leyendo
#    desde el disco, así que el endpoint no se rompe.
# ==============================================================

location = /mis-plugins-spa/spa-loader-content-html-v5 {
    return 301 /mis-plugins-spa/spa-loader-content-html-v5/;
}

location ^~ /mis-plugins-spa/spa-loader-content-html-v5/ {
    root /var/www/javascript.antonydev.tech;
    try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-html-v5/index.html;

    location ~ /\.env {
        deny all;
        return 404;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_param QUERY_STRING    $query_string;
    }
}
