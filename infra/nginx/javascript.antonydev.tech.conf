# ==============================================================
#  nginx — site file de javascript.antonydev.tech
#  --------------------------------------------------------------
#  - Va completo en /etc/nginx/sites-available/javascript.antonydev.tech
#    con symlink en sites-enabled. NO es un fragmento.
#  - El API Node se mantiene en el fragmento incluido:
#    snippets/javascript.antonydev.tech-api.conf
#  - `http2 on;` es la sintaxis vigente; `listen ... http2` está
#    deprecada desde nginx 1.25.1.
#  - Aplicar a mano en el VPS:
#      cp -a <site> <site>.bak.$(date +%F-%H%M%S)
#      (reemplazar el contenido del site file)
#      nginx -t && systemctl reload nginx
#  - Pendiente conocido: falta index.html en el web root. Mientras
#    no exista, / responde 403 y las rutas inexistentes 500 por el
#    ciclo de try_files hacia /index.html.
# ==============================================================

server {
    listen 80;
    server_name javascript.antonydev.tech;

    # Redirigir todo el tráfico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    http2 on;
    server_name javascript.antonydev.tech;

    root /var/www/javascript.antonydev.tech;
    index index.html index.htm;

    # -----  certificate  -----
    ssl_certificate /etc/letsencrypt/live/javascript.antonydev.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/javascript.antonydev.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


    # -----  mis-plugins-spa/spa-loader-content-html-v1  -----  #

    location = /mis-plugins-spa/spa-loader-content-html-v1 {
        try_files /mis-plugins-spa/spa-loader-content-html-v1/index.html =404;
    }

    location ^~ /mis-plugins-spa/spa-loader-content-html-v1/ {
        alias /var/www/javascript.antonydev.tech/mis-plugins-spa/spa-loader-content-html-v1/;
        try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-html-v1/index.html;
    }

    # -----  mis-plugins-spa/spa-loader-content-html-v2  -----  #

    location = /mis-plugins-spa/spa-loader-content-html-v2 {
        try_files /mis-plugins-spa/spa-loader-content-html-v2/index.html =404;
    }

    location ^~ /mis-plugins-spa/spa-loader-content-html-v2/ {
        alias /var/www/javascript.antonydev.tech/mis-plugins-spa/spa-loader-content-html-v2/;
        try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-html-v2/index.html;
    }


    # -----  mis-plugins-spa/spa-loader-content-html-v3  -----  #

    location = /mis-plugins-spa/spa-loader-content-html-v3 {
        try_files /mis-plugins-spa/spa-loader-content-html-v3/index.html =404;
    }

    location ^~ /mis-plugins-spa/spa-loader-content-html-v3/ {
        alias /var/www/javascript.antonydev.tech/mis-plugins-spa/spa-loader-content-html-v3/;
        try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-html-v3/index.html;
    }


    # -----  mis-plugins-spa/spa-loader-content-html-v4  -----  #

    location = /mis-plugins-spa/spa-loader-content-html-v4 {
        try_files /mis-plugins-spa/spa-loader-content-html-v4/index.html =404;
    }

    location ^~ /mis-plugins-spa/spa-loader-content-html-v4/ {
        alias /var/www/javascript.antonydev.tech/mis-plugins-spa/spa-loader-content-html-v4/;
        try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-html-v4/index.html;
    }


    # -----  mis-plugins-spa/spa-loader-content-html-v5  -----  #

    location = /mis-plugins-spa/spa-loader-content-html-v5 {
        try_files /mis-plugins-spa/spa-loader-content-html-v5/index.html =404;
    }

    location ^~ /mis-plugins-spa/spa-loader-content-html-v5/ {
        root /var/www/javascript.antonydev.tech;
        try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-html-v5/index.html;

        location ~ /\.env {
            deny all;
            return 404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param QUERY_STRING    $query_string;
        }
    }


    # -----  mis-plugins-spa/spa-loader-content-for-vite-v1  -----  #

    location = /mis-plugins-spa/spa-loader-content-for-vite-v1 {
        try_files /mis-plugins-spa/spa-loader-content-for-vite-v1/index.html =404;
    }

    location ^~ /mis-plugins-spa/spa-loader-content-for-vite-v1/ {
        alias /var/www/javascript.antonydev.tech/mis-plugins-spa/spa-loader-content-for-vite-v1/;
        try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-for-vite-v1/index.html;
    }


    # -----  mis-plugins-spa/spa-loader-content-for-vite-v2  -----  #

    location = /mis-plugins-spa/spa-loader-content-for-vite-v2 {
        try_files /mis-plugins-spa/spa-loader-content-for-vite-v2/index.html =404;
    }

    location ^~ /mis-plugins-spa/spa-loader-content-for-vite-v2/ {
        alias /var/www/javascript.antonydev.tech/mis-plugins-spa/spa-loader-content-for-vite-v2/;
        try_files $uri $uri/ /mis-plugins-spa/spa-loader-content-for-vite-v2/index.html;
    }

    # -----  API Node  -----  #
    include /etc/nginx/snippets/javascript.antonydev.tech-api.conf;


    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;

    access_log /var/log/nginx/javascript.antonydev.tech.access.log;
    error_log /var/log/nginx/javascript.antonydev.tech.error.log;
}
